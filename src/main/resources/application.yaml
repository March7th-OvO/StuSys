spring:
  application:
    name: stu-sys

  datasource:
    url: "jdbc:mysql://localhost:3306/stu_sys?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  type-aliases-package: com.furinafans.stusys.entity

server:
  port: 8080